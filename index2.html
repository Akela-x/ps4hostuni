<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PS4 - Exploit Host</title>
    <link rel="stylesheet" href="includes/style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="header-content">
                <!-- Логотип Akela из первого проекта -->
                <h1 class="main-title">
                    <span class="p-2">В</span><span class="p-2">з</span><span class="p-2">л</span><span class="p-2">о</span><span class="p-2">м</span>
                    <span class="p-2">-</span><span class="p-2">P</span><span class="p-2">S</span><span class="p-2">4</span>
                </h1>
                <div class="subtitle">WebKit Хост</div>
                <div class="version-badge">06.00-13.00</div>
            </div>
        </header>

        <h3 id="UA">Запущено на: <span id="firmware-display">PS4</span></h3>
        <hr>

        <div class="btn-container">
            <form id="kernel-options">
                <label>Эксплойт:</label>
                <div class="radio-option">
                    <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
                    <label for="netctrl-exploit">NetCtrl</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
                    <label for="lapse-exploit">Lapse</label>
                </div>
            </form>
            <button id="jeilbrek">Взломать</button>
            <div class="autoJb">
                <label for="autoJbInput" id="autoJbLabel">Автозапуск</label>
                <input class="mt-2" id="autoJbInput" type="checkbox">
            </div>
        </div>

        <pre id="console">Готово. Ожидание выполнения...</pre>

        <footer>
            <p class="credit">Специально для 4PDA Sony PlayStation 4 - Взлом</p>
            <p class="thanks">Особая благодарность всем разработчикам сцены</p>
        </footer>
    </div>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
</body>
</html>
